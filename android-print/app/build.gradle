plugins {
    id "com.android.application"
}

android {
    namespace "id.kebayaoma.print"
    compileSdk 35

    defaultConfig {
        applicationId "id.kebayaoma.print"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // dipasang manual (sideload) di tablet toko — ditandatangani kunci debug lokal
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
